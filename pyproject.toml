[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-publishing-mcp"
version = "0.1.0"
description = "MCP server for publication-quality A4 PDF typesetting from Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DCode1119"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mcp>=1.0.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/DCode1119/MarkdownPublishingMCP"
Repository = "https://github.com/DCode1119/MarkdownPublishingMCP"
Issues = "https://github.com/DCode1119/MarkdownPublishingMCP/issues"

[project.scripts]
md-publishing-mcp = "md_publishing_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_publishing_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
