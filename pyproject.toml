[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-publishing-mcp"
version = "0.1.0"
description = "MCP server for publication-quality A4 PDF typesetting from Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
urls = {homepage = "https://github.com/DCode1119/MarkdownPublishingMCP"}
dependencies = [
    "mcp>=1.0.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
md-publishing-mcp = "md_publishing_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
